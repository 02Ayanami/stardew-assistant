name: stardew-assistant-simple
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stardew_simple
      MYSQL_USER: stardew
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-stardew-simple-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-stardew-simple-root}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    ports: ["127.0.0.1:${MYSQL_PORT:-3307}:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -e 'SELECT 1' $$MYSQL_DATABASE"]
      interval: 5s
      retries: 40
      start_period: 30s
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes: ["etcd-data:/etcd"]
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    volumes: ["minio-data:/data"]
  milvus:
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on: [etcd, minio]
    ports: ["127.0.0.1:${MILVUS_PORT:-19531}:19530", "127.0.0.1:${MILVUS_HEALTH_PORT:-19092}:9091"]
    volumes: ["milvus-data:/var/lib/milvus"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 90s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      PORT: 9911
      DATABASE_URL: jdbc:mysql://mysql:3306/stardew_simple?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-stardew-simple-local}
      MILVUS_URI: http://milvus:19530
      DATA_DIR: /app/data/game
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-glm-5.3-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.35}
    ports: ["127.0.0.1:${DOCKER_API_PORT:-9911}:9911"]
    depends_on:
      mysql: {condition: service_healthy}
      milvus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9911/api/health"]
      interval: 5s
      start_period: 45s
      retries: 30
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:${DOCKER_WEB_PORT:-8081}:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  mysql-data:
  milvus-data:
  etcd-data:
  minio-data:
