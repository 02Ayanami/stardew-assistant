server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 resolver 127.0.0.11 valid=10s ipv6=off;
 location /api/ {
  set $backend http://backend:9911;
  proxy_pass $backend;
  proxy_http_version 1.1;
  proxy_read_timeout 150s;
  proxy_send_timeout 150s;
 }
 location / { try_files $uri $uri/ /index.html; }
}
