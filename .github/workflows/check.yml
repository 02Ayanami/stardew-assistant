name: Verify Valley Companion
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start isolated services
        run: docker compose up -d --wait --wait-timeout 180 mysql milvus
      - name: Backend tests with real MySQL and Milvus
        working-directory: backend
        run: ./mvnw -B verify
      - name: Frontend and browser checks
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test -- --run
          npm run build
          npm run test:e2e
      - name: Stop only this project's services
        if: always()
        run: docker compose -p stardew-assistant-simple down
